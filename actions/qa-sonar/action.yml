name: SonarQube Scan
description: Scan source code with SonarQube (Polyglot)

inputs:
  app-name:
    description: The app name
    required: true
  project-key:
    description: Custom Sonar Project Key (optional)
    required: false
    default: ""
  organization:
    description: the organization
    required: true
  app-version:
    description: Application version (defaults to build-timestamp)
    required: false
    default: ""
  app-code:
    description: Application code (optional)
    required: false
    default: ""
  build-timestamp:
    description: The build timestamp
    required: true
  tek:
    description: Technology (java|maven|gradle|kmp|android|nextjs|nodejs|net-core|mainframe|...)
    required: false
    default: ""
  sonar-url:
    description: SonarQube URL
    required: false
    default: "https://sonarcloud.io"
  sonar-token:
    description: SonarQube token
    required: false
    default: ""
  coverage-path:
    description: Coverage report path (lcov.info, jacoco.xml, opencover.xml, kover xml)
    required: false
    default: ""
  coverage-tool:
    description: Coverage tool (jacoco|kover|opencover|lcov|auto)
    required: false
    default: "auto"
  coverage-exclusions:
    description: Coverage exclusions
    required: false
    default: ""
  java-binaries:
    description: Java binaries path
    required: false
    default: "target/classes,build/classes"
  sources:
    description: Source roots to scan
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Create file sonar-project.properties
      shell: bash
      run: |
        VERSION="${{ inputs.app-version }}"
        [ -z "$VERSION" ] && VERSION="${{ inputs.build-timestamp }}"
        APP_CODE="${{ inputs.app-code }}"
        [ -z "$APP_CODE" ] && APP_CODE="${{ inputs.app-name }}"

        # Lógica para definir el Project Key de forma inteligente
        PROJ_KEY="${{ inputs.project-key }}"
        [ -z "$PROJ_KEY" ] && PROJ_KEY="${{ inputs.organization }}:${{ inputs.app-name }}"

        cat > sonar-project.properties <<EOF
        sonar.host.url=${{ inputs.sonar-url }}
        sonar.organization=${{ inputs.organization }}
        sonar.projectKey=${PROJ_KEY}
        sonar.projectName=${{ inputs.app-name }}
        sonar.sourceEncoding=UTF-8
        sonar.sources=${{ inputs.sources }}
        sonar.links.ci=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        sonar.links.scm=https://github.com/${{ github.repository }}.git
        sonar.projectVersion=${VERSION}
        sonar.analysis.userId=${{ github.actor }}
        sonar.analysis.commitId=${{ github.sha }}
        sonar.analysis.tek=${{ inputs.tek }}
        sonar.analysis.projectName=${APP_CODE}
        sonar.analysis.branch=${{ github.ref }}
        sonar.analysis.jobname=${{ github.job }}
        EOF

        TEK="${{ inputs.tek }}"
        # Java/Maven
        if [[ "$TEK" == "java" || "$TEK" == "maven" ]]; then
          echo "sonar.java.binaries=${{ inputs.java-binaries }}" >> sonar-project.properties
          echo "sonar.junit.reportPaths=target/surefire-reports" >> sonar-project.properties
          if [ -n "${{ inputs.coverage-path }}" ]; then
            echo "sonar.coverage.jacoco.xmlReportPaths=${{ inputs.coverage-path }}" >> sonar-project.properties
          else
            echo "sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml,target/site/jacoco-ut/jacoco.xml" >> sonar-project.properties
          fi
          echo "sonar.java.coveragePlugin=jacoco" >> sonar-project.properties
          [ -n "${{ inputs.coverage-exclusions }}" ] && echo "sonar.coverage.exclusions=${{ inputs.coverage-exclusions }}" >> sonar-project.properties
        fi

        # Gradle/Java
        if [[ "$TEK" == "gradle" ]]; then
          echo "sonar.java.binaries=${{ inputs.java-binaries }}" >> sonar-project.properties
          echo "sonar.junit.reportPaths=build/test-results/test" >> sonar-project.properties
          if [ -n "${{ inputs.coverage-path }}" ]; then
            echo "sonar.coverage.jacoco.xmlReportPaths=${{ inputs.coverage-path }}" >> sonar-project.properties
          else
            echo "sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml" >> sonar-project.properties
          fi
          echo "sonar.java.coveragePlugin=jacoco" >> sonar-project.properties
          [ -n "${{ inputs.coverage-exclusions }}" ] && echo "sonar.coverage.exclusions=${{ inputs.coverage-exclusions }}" >> sonar-project.properties
        fi

        # KMP/Kover
        if [[ "$TEK" == "kmp" || "$TEK" == "kotlin-multiplatform" ]]; then
          echo "sonar.java.binaries=${{ inputs.java-binaries }}" >> sonar-project.properties
          if [ -n "${{ inputs.coverage-path }}" ]; then
            echo "sonar.kotlin.coverage.reportPaths=${{ inputs.coverage-path }}" >> sonar-project.properties
          else
            echo "sonar.kotlin.coverage.reportPaths=build/reports/kover/report.xml" >> sonar-project.properties
          fi
          [ -n "${{ inputs.coverage-exclusions }}" ] && echo "sonar.coverage.exclusions=${{ inputs.coverage-exclusions }}" >> sonar-project.properties
        fi

        # Android (AGP: fuentes, clases compiladas y cobertura JaCoCo de tests unitarios)
        if [[ "$TEK" == "android" ]]; then
          # Solo directorios existentes: el scanner falla si sonar.sources/sonar.tests apuntan a carpetas inexistentes
          SOURCES=""
          for d in app/src/main/java app/src/main/kotlin; do
            [ -d "$d" ] && SOURCES="${SOURCES:+$SOURCES,}$d"
          done
          [ -n "$SOURCES" ] && echo "sonar.sources=$SOURCES" >> sonar-project.properties

          TESTS=""
          for d in app/src/test/java app/src/test/kotlin app/src/androidTest/java app/src/androidTest/kotlin; do
            [ -d "$d" ] && TESTS="${TESTS:+$TESTS,}$d"
          done
          [ -n "$TESTS" ] && echo "sonar.tests=$TESTS" >> sonar-project.properties

          # Clases compiladas: solo se registran los directorios que existen (las rutas de AGP varian segun version)
          BINARIES=""
          for d in app/build/intermediates/javac/debug/classes app/build/tmp/kotlin-classes/debug app/build/intermediates/classes/debug app/build/intermediates/classes; do
            [ -d "$d" ] && BINARIES="${BINARIES:+$BINARIES,}$d"
          done
          [ -n "$BINARIES" ] && echo "sonar.java.binaries=$BINARIES" >> sonar-project.properties

          # Resultados de tests unitarios (variantes debug/release)
          TEST_REPORTS=""
          for d in app/build/test-results/testDebugUnitTest app/build/test-results/testReleaseUnitTest; do
            [ -d "$d" ] && TEST_REPORTS="${TEST_REPORTS:+$TEST_REPORTS,}$d"
          done
          [ -n "$TEST_REPORTS" ] && echo "sonar.junit.reportPaths=$TEST_REPORTS" >> sonar-project.properties

          echo "sonar.java.coveragePlugin=jacoco" >> sonar-project.properties
          if [ -n "${{ inputs.coverage-path }}" ]; then
            echo "sonar.coverage.jacoco.xmlReportPaths=${{ inputs.coverage-path }}" >> sonar-project.properties
          else
            echo "sonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml,app/build/reports/jacoco/**/jacocoTestReport.xml" >> sonar-project.properties
          fi
          if [ -n "${{ inputs.coverage-exclusions }}" ]; then
            echo "sonar.coverage.exclusions=${{ inputs.coverage-exclusions }}" >> sonar-project.properties
          else
            echo "sonar.coverage.exclusions=**/R.java,**/R.kt,**/BuildConfig.*,**/Manifest*.,**/*_Factory*,**/*_MembersInjector*,**/*_Impl*,**/dagger/**,**/hilt_*,**/*Hilt_*,**/*_HiltModules*,**/*_Provide*,**/*_FactoryProvider*" >> sonar-project.properties
          fi
        fi

        # JS/TS/Next.js/Node
        if [[ "$TEK" == "nextjs" || "$TEK" == "nodejs" || "$TEK" == "javascript" || "$TEK" == "typescript" || "$TEK" == "node" ]]; then
          echo "sonar.sources=${{ inputs.sources }}" >> sonar-project.properties
          echo "sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx" >> sonar-project.properties
          echo "sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/*.test.js,**/*.spec.js" >> sonar-project.properties
          if [ -n "${{ inputs.coverage-path }}" ]; then
            echo "sonar.javascript.lcov.reportPaths=${{ inputs.coverage-path }}" >> sonar-project.properties
            echo "sonar.typescript.lcov.reportPaths=${{ inputs.coverage-path }}" >> sonar-project.properties
          fi
          [ -n "${{ inputs.coverage-exclusions }}" ] && echo "sonar.coverage.exclusions=${{ inputs.coverage-exclusions }}" >> sonar-project.properties
        fi

        # .NET Core
        if [[ "$TEK" == "net-core" || "$TEK" == "dotnet" || "$TEK" == "csharp" ]]; then
          if [ -n "${{ inputs.coverage-path }}" ]; then
            echo "sonar.cs.opencover.reportsPaths=${{ inputs.coverage-path }}" >> sonar-project.properties
            echo "sonar.cs.opencover.reportPaths.relative=true" >> sonar-project.properties
          fi
          [ -n "${{ inputs.coverage-exclusions }}" ] && echo "sonar.coverage.exclusions=${{ inputs.coverage-exclusions }}" >> sonar-project.properties
        fi

        # Mainframe
        if [[ "$TEK" == "mainframe" ]]; then
          echo "sonar.sources=${{ inputs.sources }}" >> sonar-project.properties
          echo "sonar.inclusions=**/*.cbl,**/*.cob,**/*.cpy" >> sonar-project.properties
          echo "sonar.cobol.file.suffixes=.cbl,.cpy,.cob" >> sonar-project.properties
          echo "sonar.cobol.copy.suffixes=cpy" >> sonar-project.properties
          echo "sonar.cobol.sourceFormat=fixed" >> sonar-project.properties
          echo "sonar.cobol.dialect=ibm-enterprise-cobol" >> sonar-project.properties
        fi

        cat sonar-project.properties
        cat sonar-project.properties >> "$GITHUB_STEP_SUMMARY"

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@13990a695682794b53148ff9f6a8b6e22e43955e
      env:
        SONAR_HOST_URL: ${{ inputs.sonar-url }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}

    - name: Print report
      shell: bash
      run: |
        echo "## SonarQube Scan Results" >> "$GITHUB_STEP_SUMMARY"
        cat .scannerwork/report-task.txt
        cat .scannerwork/report-task.txt >> "$GITHUB_STEP_SUMMARY"

    - name: SonarQube Quality Gate check
      id: sonarqube-quality-gate-check
      uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
      env:
        SONAR_HOST_URL: ${{ inputs.sonar-url }}
        SONAR_TOKEN: ${{ inputs.sonar-token }}

    - name: Show SonarQube Quality Gate Status value
      shell: bash
      run: |
        echo "## SonarQube Quality Gate Status" >> "$GITHUB_STEP_SUMMARY"
        echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}" >> "$GITHUB_STEP_SUMMARY"
        echo "The Quality Gate status is ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
